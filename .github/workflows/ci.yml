name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      ITENSOR_ROOT: ${{ runner.temp }}/itensor
      BUILD_DIR: ${{ github.workspace }}/build

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format libblas-dev liblapack-dev

      - name: Restore ITensor cache
        id: itensor-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ITENSOR_ROOT }}
          key: itensor-v3-ubuntu-24.04-gcc17-lapack

      - name: Build ITensor
        if: steps.itensor-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v3 https://github.com/ITensor/ITensor.git "$ITENSOR_ROOT"
          cp "$ITENSOR_ROOT/options.mk.sample" "$ITENSOR_ROOT/options.mk"
          sed -i 's|^PLATFORM=.*|PLATFORM=lapack|' "$ITENSOR_ROOT/options.mk"
          sed -i 's|^#BLAS_LAPACK_LIBFLAGS=.*|BLAS_LAPACK_LIBFLAGS=-lpthread -lblas -llapack|' "$ITENSOR_ROOT/options.mk"
          make --directory="$ITENSOR_ROOT" --jobs 1

      - name: Configure
        run: cmake -S . -B "$BUILD_DIR" -DITENSOR_ROOT="$ITENSOR_ROOT" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Check formatting
        run: cmake --build "$BUILD_DIR" --target format-check

      - name: Run tests
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure

      - name: Run smoke simulation
        working-directory: ${{ runner.temp }}
        run: |
          "$BUILD_DIR/3siteHam" N 4 TL 10 TR 10 dbeta 0.1 T 0 Energy_beta 0

      - name: Package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar --create --gzip --file folded-xxz-linux-amd64.tar.gz -C "$BUILD_DIR" 3siteHam

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: folded-xxz-linux-amd64
          path: folded-xxz-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: folded-xxz-linux-amd64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" folded-xxz-linux-amd64.tar.gz \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
